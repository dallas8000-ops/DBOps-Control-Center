# Optional buyer deploy path (Render). Seller production is on Railway — see railway.toml + Dockerfile.
version: "1"

databases:
  - name: dbops-db
    databaseName: dbops
    user: dbops

services:
  - type: web
    name: dbops-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dbops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      # Stripe: set values in Render dashboard (see docs/STRIPE_RENDER_SETUP.md). Verify: GET /health/billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      # OIDC/SSO: set values in Render dashboard. Verify: GET /health/oidc
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_DEFAULT_ROLE
        sync: false

  - type: web
    name: dbops-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_OIDC_REDIRECT_URI
        sync: false
