global:
  scrape_interval: 15s

scrape_configs:
  - job_name: dbops-api
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials: YOUR_METRICS_BEARER_TOKEN
    static_configs:
      - targets:
          - dbops-api.onrender.com
        labels:
          service: dbops-api
          environment: production
