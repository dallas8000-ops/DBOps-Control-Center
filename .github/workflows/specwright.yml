# Generated by Specwright CI — do not edit by hand; run: python scripts/specwright_ci.py --write
name: Specwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  specwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Specwright scan (OpenAPI drift + score gate)
        env:
          SPECWRIGHT_MIN_SCORE: "45"
        run: python scripts/specwright_ci.py

      - name: Upload score artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specwright-score
          path: docs/specwright-score.json
